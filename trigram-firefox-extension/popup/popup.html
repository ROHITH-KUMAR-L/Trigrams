<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trigram Autofill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="url(#grad)" opacity="0.15" />
            <circle cx="12" cy="12" r="6" fill="url(#grad)" opacity="0.3" />
            <circle cx="12" cy="12" r="3" fill="url(#grad)" />
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#6366f1" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="header-text">
          <h1>Trigram</h1>
          <span class="header-subtitle">Autofill Engine</span>
        </div>
      </div>
      <div class="status-chip" id="statusChip">
        <span class="status-indicator"></span>
        <span class="status-label">Checking…</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Connection Card -->
      <div class="card connection-card" id="connectionCard">
        <div class="card-row">
          <div class="card-row-info">
            <span class="card-label">API Endpoint</span>
            <span class="card-hint">Local trigram server</span>
          </div>
        </div>
        <input type="text" id="apiUrl" value="http://127.0.0.1:8080" class="text-input" spellcheck="false">
      </div>

      <!-- Settings Card -->
      <div class="card">
        <div class="card-row">
          <div class="card-row-info">
            <span class="card-label">Enable Autofill</span>
            <span class="card-hint">Show predictions while typing</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="enableToggle" checked>
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="divider"></div>

        <div class="card-row vertical">
          <div class="slider-header">
            <span class="card-label">Temperature</span>
            <span class="slider-value" id="tempDisplay">1.0</span>
          </div>
          <input type="range" id="tempSlider" min="0.1" max="2.0" step="0.1" value="1.0" class="range-slider">
          <div class="slider-extremes">
            <span>Focused</span>
            <span>Creative</span>
          </div>
        </div>
      </div>

      <!-- Stats Card -->
      <div class="card stats-card" id="statsCard">
        <div class="stats-title">Model Statistics</div>
        <div class="stats-row">
          <div class="stat">
            <span class="stat-number" id="totalTrigrams">—</span>
            <span class="stat-caption">Trigrams</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-number" id="uniqueWords">—</span>
            <span class="stat-caption">Unique Words</span>
          </div>
        </div>
      </div>

      <!-- Error Banner -->
      <div class="error-banner hidden" id="errorBanner">
        <svg class="error-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v3a.75.75 0 01-1.5 0V5zM8 11.5a.75.75 0 100-1.5.75.75 0 000 1.5z" />
        </svg>
        <span class="error-text">Cannot connect to API</span>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn btn-ghost" id="refreshBtn">
        <svg class="btn-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 3a5 5 0 00-4.546 2.914.5.5 0 01-.908-.418A6 6 0 0114 8a.5.5 0 01-1 0 5 5 0 00-5-5z" />
          <path d="M3 8a.5.5 0 011 0 4 4 0 007.546 1.914.5.5 0 11.908.418A5 5 0 013 8z" />
          <path
            d="M3.5 5.5a.5.5 0 00-.5.5v2a.5.5 0 00.5.5h2a.5.5 0 000-1H4.5V6a.5.5 0 00-.5-.5h-.5zm9 3a.5.5 0 00-.5.5v.5h-1a.5.5 0 000 1h2a.5.5 0 00.5-.5v-2a.5.5 0 00-.5-.5z" />
        </svg>
        Refresh
      </button>
      <button class="btn btn-primary" id="saveBtn">
        Save Settings
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
